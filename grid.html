<div class="grid">{% for p in products %}<div class="card">{% if p.image %}<img src="/uploads/{{ p.image }}" alt="{{ p.name }}">{% endif %}
<h3>{{ p.name }}</h3><p>{{ p.description }}</p>
{% if p.available %}<div class="price">Rs. {{ p.price }} per {{ p.unit }}</div><a class="btn" href="/order">Order Now</a>
{% else %}<span class="na">Currently Unavailable</span>{% endif %}</div>{% else %}<p>No products yet.</p>{% endfor %}</div>
